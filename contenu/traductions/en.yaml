obsoletes:
  - id: "ch02_ville_b0f79608"
    source: "Le matin est clair, la rue presque vide. L'immeuble, le chantier de la photo, le café de la gare : je peux aller partout."
    texte: "The morning is clear, the street almost empty. The building, the site from the photo, the station café: I can go anywhere."
