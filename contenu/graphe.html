:["Monter directement","Lui faire confiance","← L'immeuble › L'appartement de Léna","← Lyon › Le café de la gare","L'immeuble › L'appartement de Léna"],"scenes":["CH01_SC01","CH01_SC02","CH01_SC03A","CH01_SC04","CH02_MATIN","CH02_LENA","CH02_CAFE","CH02_SOIR","CH02_EPILOGUE"],"etapes":[{"de":"CH01_SC01","vers":"CH01_SC02","choix":"Monter directement"},{"de":"CH01_SC02","vers":"CH01_SC03A","choix":"Lui faire confiance"},{"de":"CH01_SC03A","vers":"CH01_SC04","choix":null},{"de":"CH01_SC04","vers":"CH02_MATIN","choix":null},{"de":"CH02_MATIN","vers":"CH02_LENA","choix":"← L'immeuble › L'appartement de Léna"},{"de":"CH02_LENA","vers":"CH02_CAFE","choix":"← Lyon › Le café de la gare"},{"de":"CH02_CAFE","vers":"CH02_SOIR","choix":"L'immeuble › L'appartement de Léna"},{"de":"CH02_SOIR","vers":"CH02_EPILOGUE","choix":null}],"etat":{"mystere":"1","indice_photo":"False","indice_carnet":"False","moi_observation":"0","lena_photographie":"4","lena_moi":"8","lena_karim":"5","karim_chantier":"5","creneau":"0","moment":"\"matin\"","jour":"94","jour_semaine_rang":"6","jour_semaine":"\"dimanche\"","jour_mois":"17","mois":"1","annee":"2027","temps_longueur_mois":"31","temps_bissextile_rang":"3","temps_saut":"0","temps_cible_jour":"17","temps_cible_mois":"1","evenement_anniversaire_lena":"False","epoque":"\"present\"","epoque_present_annee":"2026","epoque_present_mois":"10","epoque_present_jour_mois":"16","epoque_present_jour":"1","epoque_present_jour_semaine_rang":"4","epoque_present_creneau":"2","epoque_present_temps_longueur_mois":"31","epoque_present_temps_bissextile_rang":"2","epoque_passe_annee":"2016","epoque_passe_mois":"10","epoque_passe_jour_mois":"16","epoque_passe_jour":"1","epoque_passe_jour_semaine_rang":"6","epoque_passe_creneau":"2","epoque_passe_temps_longueur_mois":"31","epoque_passe_temps_bissextile_rang":"0","lieu_lena":"\"appartement_lena\"","lieu_karim":"\"cafe\""}},{"nom":"route_12","fin":"CH02_EPILOGUE","choix":["Monter directement","Lui faire confiance","← L'immeuble › L'appartement de Léna","← Lyon › Le chantier","L'immeuble › L'appartement de Léna"],"scenes":["CH01_SC01","CH01_SC02","CH01_SC03A","CH01_SC04","CH02_MATIN","CH02_LENA","CH02_CHANTIER","CH02_SOIR","CH02_EPILOGUE"],"etapes":[{"de":"CH01_SC01","vers":"CH01_SC02","choix":"Monter directement"},{"de":"CH01_SC02","vers":"CH01_SC03A","choix":"Lui faire confiance"},{"de":"CH01_SC03A","vers":"CH01_SC04","choix":null},{"de":"CH01_SC04","vers":"CH02_MATIN","choix":null},{"de":"CH02_MATIN","vers":"CH02_LENA","choix":"← L'immeuble › L'appartement de Léna"},{"de":"CH02_LENA","vers":"CH02_CHANTIER","choix":"← Lyon › Le chantier"},{"de":"CH02_CHANTIER","vers":"CH02_SOIR","choix":"L'immeuble › L'appartement de Léna"},{"de":"CH02_SOIR","vers":"CH02_EPILOGUE","choix":null}],"etat":{"mystere":"0","indice_photo":"False","indice_carnet":"False","moi_observation":"0","lena_photographie":"4","lena_moi":"7","lena_karim":"5","karim_chantier":"5","creneau":"0","moment":"\"matin\"","jour":"94","jour_semaine_rang":"6","jour_semaine":"\"dimanche\"","jour_mois":"17","mois":"1","annee":"2027","temps_longueur_mois":"31","temps_bissextile_rang":"3","temps_saut":"0","temps_cible_jour":"17","temps_cible_mois":"1","evenement_anniversaire_lena":"False","epoque":"\"present\"","epoque_present_annee":"2026","epoque_present_mois":"10","epoque_present_jour_mois":"16","epoque_present_jour":"1","epoque_present_jour_semaine_rang":"4","epoque_present_creneau":"2","epoque_present_temps_longueur_mois":"31","epoque_present_temps_bissextile_rang":"2","epoque_passe_annee":"2016","epoque_passe_mois":"10","epoque_passe_jour_mois":"16","epoque_passe_jour":"1","epoque_passe_jour_semaine_rang":"6","epoque_passe_creneau":"2","epoque_passe_temps_longueur_mois":"31","epoque_passe_temps_bissextile_rang":"0","lieu_lena":"\"appartement_lena\"","lieu_karim":"\"cafe\""}}],"problemes":[]};</script>
<script>
"use strict";
(function () {
  const D = DONNEES;
  if (!D) {
    document.body.textContent = "Modèle du graphe : lancez .venv/bin/python tools/fiches.py graphe";
    return;
  }
  const G = D.geometrie;
  const $ = (id) => document.getElementById(id);
  const vue = $("vue"), plan = $("plan"), svg = $("liens"), calque = $("noeuds");
  const panneau = $("panneau"), recherche = $("recherche"), menuRoutes = $("route");
  const SVG = "http://www.w3.org/2000/svg";
  const ICONES = {choix: "◆", suite: "→", appel: "↪", carte: "◎", fin: "■", retour: "↩"};
  const COULEUR_ETAT = {"définitive": "vert", "provisoire": "gris", "manquante": "rouge"};

  // --- Outils -----------------------------------------------------------------------------

  function el(tag, attributs, ...enfants) {
    const noeud = document.createElement(tag);
    for (const [cle, valeur] of Object.entries(attributs || {})) {
      if (valeur === null || valeur === undefined || valeur === false) continue;
      if (cle === "class") noeud.className = valeur;
      else if (cle === "style") Object.assign(noeud.style, valeur);
      else if (cle.startsWith("on")) noeud.addEventListener(cle.slice(2), valeur);
      else noeud.setAttribute(cle, valeur === true ? "" : String(valeur));
    }
    for (const enfant of enfants.flat(Infinity)) {
      if (enfant === null || enfant === undefined || enfant === false || enfant === "") continue;
      noeud.append(enfant instanceof Node ? enfant : String(enfant));
    }
    return noeud;
  }

  function svgEl(tag, attributs) {
    const noeud = document.createElementNS(SVG, tag);
    for (const [cle, valeur] of Object.entries(attributs)) noeud.setAttribute(cle, String(valeur));
    return noeud;
  }

  const badge = (texte, couleur, titre) => el("span", {class: "badge " + couleur, title: titre}, texte);
  const pluriel = (n, mot) => `${n} ${mot}${n > 1 ? "s" : ""}`;

  // Géométrie des scènes, fixée par tools/fiches.py (positions des liens calculées là-bas).
  for (const cle of ["largeur", "entete", "haut_sorties", "ligne"]) {
    document.documentElement.style.setProperty("--" + cle.replace("_", "-"), G[cle] + "px");
  }

  // --- Barre du haut ------------------------------------------------------------------------

  const st = D.stats;
  $("titre").textContent = D.titre;
  $("stats").textContent = [
    pluriel(st.scenes, "scène"), pluriel(st.fins, "fin"),
    `${st.etats} état${st.etats > 1 ? "s" : ""} exploré${st.etats > 1 ? "s" : ""}`,
    st.complete ? null : "exploration partielle",
    D.langues.length > 1 ? "langues : " + D.langues.map((l) => l.toUpperCase()).join(", ") : null,
  ].filter(Boolean).join(" · ");
  $("bouton-avertissements").textContent = `Avertissements (${D.problemes.length})`;

  // --- Scènes et liens ---------------------------------------------------------------------

  const scenes = new Map(D.scenes.map((s) => [s.id, s]));
  const noeuds = new Map();
  const liens = [];

  plan.style.width = D.largeur + "px";
  plan.style.height = D.hauteur + "px";
  svg.setAttribute("width", D.largeur);
  svg.setAttribute("height", D.hauteur);
  const defs = svgEl("defs", {});
  for (const type of ["choix", "suite", "appel", "carte", "jamais"]) {
    const pointe = svgEl("marker", {id: "pointe-" + type, viewBox: "0 0 10 10", refX: 9, refY: 5,
      markerWidth: 10, markerHeight: 10, markerUnits: "userSpaceOnUse", orient: "auto"});
    pointe.append(svgEl("path", {d: "M0,1 L10,5 L0,9 z", class: "pointe " + type}));
    defs.append(pointe);
  }
  svg.append(defs);

  function ligneSortie(sortie) {
    const jamais = sortie.propose === false;
    const details = [sortie.si && "si " + sortie.si, sortie.effets && "effets : " + sortie.effets,
      sortie.destination && "→ " + sortie.destination, jamais && "jamais proposé : sa condition est fausse sur toutes les routes"];
    return el("li", {class: ["sortie", sortie.type, jamais && "jamais"].filter(Boolean).join(" "),
      title: [sortie.libelle, ...details].filter(Boolean).join("\n")},
      el("span", {class: "icone"}, sortie.si ? "◇" : (ICONES[sortie.type] || "•")),
      el("span", {class: "libelle"}, sortie.libelle),
      sortie.si ? el("span", {class: "si"}, "si") : null,
      sortie.destination ? el("span", {class: "port"}) : null);
  }

  for (const s of D.scenes) {
    const badges = [];
    if (s.debut) badges.push(badge("début", "vert"));
    if (!s.atteinte) badges.push(badge("jamais atteinte", "rouge", "Aucune route ne mène à cette scène depuis le début"));
    if (s.repliques === 0) badges.push(badge("squelette", "gris", "Aucune réplique écrite"));
    if (s.avertissements.length) badges.push(badge("⚠ " + s.avertissements.length, "ambre", s.avertissements.join("\n")));
    const manquants = s.medias.filter((m) => m.etat === "manquante").length;
    if (manquants) badges.push(badge(`${pluriel(manquants, "média")} manquant${manquants > 1 ? "s" : ""}`, "rouge"));
    for (const t of s.traductions) {
      if (t.faites < t.total) badges.push(badge(`${t.code.toUpperCase()} ${t.faites}/${t.total}`, "ambre", "Traduction incomplète"));
    }
    if (s.galerie) badges.push(badge("galerie", "bleu", s.galerie));
    const div = el("div", {
      class: ["noeud", s.debut && "debut", !s.atteinte && "non-atteinte"].filter(Boolean).join(" "),
      role: "button", tabindex: 0, "aria-label": `${s.id} ${s.titre}`,
      style: {left: s.x + "px", top: s.y + "px", height: s.h + "px"},
    },
      el("div", {class: "entete"},
        el("div", {class: "ligne-id"}, el("span", {class: "sid"}, s.id), el("span", {class: "badges"}, badges)),
        el("div", {class: "titre-scene", title: s.titre}, s.titre || "(sans titre)"),
        el("div", {class: "meta"}, [s.lieu, s.moment].filter(Boolean).join(" · ") || " ")),
      el("ul", {class: "sorties"}, s.sorties.map(ligneSortie)));
    div.addEventListener("click", (e) => { e.stopPropagation(); selectionner(s.id); });
    div.addEventListener("dblclick", (e) => { e.stopPropagation(); centrer(s.id, 1); });
    div.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectionner(s.id, true); }
    });
    div.addEventListener("mouseenter", () => survoler(s.id, true));
    div.addEventListener("mouseleave", () => survoler(s.id, false));
    calque.append(div);
    noeuds.set(s.id, div);
  }

  function trace(arete) {
    const de = scenes.get(arete.de), vers = scenes.get(arete.vers);
    const sx = de.x + G.largeur, sy = de.y + G.entete + G.haut_sorties + arete.sortie * G.ligne + G.ligne / 2;
    const tx = vers.x - 2, ty = vers.y + G.entete / 2;
    if (tx - sx > 20) {
      const dx = Math.max(50, (tx - sx) / 2);
      return `M${sx},${sy} C${sx + dx},${sy} ${tx - dx},${ty} ${tx},${ty}`;
    }
    // Retour en arrière, ou même colonne : la courbe passe au-dessus des deux scènes.
    const haut = Math.min(de.y, vers.y) - 45, dx = 70, milieu = (sx + tx) / 2;
    return `M${sx},${sy} C${sx + dx},${sy} ${sx + dx},${haut} ${milieu},${haut} S${tx - dx},${ty} ${tx},${ty}`;
  }

  for (const arete of D.aretes) {
    const type = arete.propose === false ? "jamais" : arete.type;
    const chemin = svgEl("path", {d: trace(arete), class: `lien ${type}`, "marker-end": `url(#pointe-${type})`});
    svg.append(chemin);
    liens.push({arete, chemin});
  }

  function survoler(id, actif) {
    for (const {arete, chemin} of liens) {
      if (arete.de === id || arete.vers === id) chemin.classList.toggle("survol", actif);
    }
  }

  // --- Sélection, route, recherche ----------------------------------------------------------

  let choisi = null, routeActive = null, trouves = null;

  function liensDeRoute(route) {
    const indices = new Set();
    for (const etape of route.etapes) {
      const i = liens.findIndex(({arete}) => arete.de === etape.de && arete.vers === etape.vers
        && (etape.choix === null ? arete.type === "suite" : arete.libelle === etape.choix));
      if (i >= 0) indices.add(i);
    }
    return indices;
  }

  function miseAJour() {
    let visibles = null, actifs = null;
    if (routeActive) {
      visibles = new Set(routeActive.scenes);
      actifs = liensDeRoute(routeActive);
    } else if (choisi) {
      visibles = new Set([choisi]);
      actifs = new Set();
      liens.forEach(({arete}, i) => {
        if (arete.de === choisi || arete.vers === choisi) {
          actifs.add(i);
          visibles.add(arete.de);
          visibles.add(arete.vers);
        }
      });
    } else if (trouves) {
      visibles = trouves;
      actifs = new Set();
    }
    for (const [id, div] of noeuds) {
      div.classList.toggle("attenue", visibles !== null && !visibles.has(id));
      div.classList.toggle("choisi", id === choisi);
      div.classList.toggle("sur-route", routeActive !== null && visibles.has(id));
      div.classList.toggle("trouve", trouves !== null && trouves.has(id));
    }
    liens.forEach(({chemin}, i) => {
      chemin.classList.toggle("attenue", actifs !== null && !actifs.has(i));
      chemin.classList.toggle("actif", actifs !== null && actifs.has(i));
    });
  }

  function selectionner(id, centrerVue) {
    const scene = scenes.get(id);
    if (!scene) return;
    choisi = id;
    routeActive = null;
    menuRoutes.value = "";
    afficherScene(scene);
    miseAJour();
    if (centrerVue) centrer(id);
  }

  function toutDeselectionner() {
    choisi = null;
    routeActive = null;
    menuRoutes.value = "";
    fermerPanneau();
    miseAJour();
  }

  for (const route of D.routes) {
    menuRoutes.append(el("option", {value: route.nom},
      `${route.nom} → ${route.fin}${route.choix.length ? " : " + route.choix.join(" · ") : ""}`));
  }
  menuRoutes.disabled = D.routes.length === 0;
  menuRoutes.addEventListener("change", () => {
    const route = D.routes.find((r) => r.nom === menuRoutes.value);
    if (!route) { toutDeselectionner(); return; }
    choisi = null;
    routeActive = route;
    afficherRoute(route);
    miseAJour();
    cadrer(route.scenes);
  });

  recherche.addEventListener("input", () => {
    const q = recherche.value.trim().toLowerCase();
    trouves = q ? new Set(D.scenes.filter((s) => [s.id, s.titre, s.lieu, s.moment, s.resume]
      .some((v) => (v || "").toLowerCase().includes(q))).map((s) => s.id)) : null;
    miseAJour();
  });
  recherche.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && trouves && trouves.size) selectionner(trouves.values().next().value, true);
  });

  // --- Panneau de détails -------------------------------------------------------------------

  function ouvrirPanneau(contenu) {
    panneau.replaceChildren(...contenu.flat().filter(Boolean));
    panneau.hidden = false;
    panneau.scrollTop = 0;
    document.body.classList.add("panneau-ouvert");
  }

  function fermerPanneau() {
    panneau.hidden = true;
    document.body.classList.remove("panneau-ouvert");
  }

  const section = (titre, contenu) => (contenu ? el("section", {}, el("h3", {}, titre), contenu) : null);

  const lienScene = (id) => el("button", {type: "button", class: "lien-scene", title: (scenes.get(id) || {}).titre || "",
    onclick: () => selectionner(id, true)}, id);

  function entetePanneau(surtitre, titre, detail) {
    return el("div", {class: "panneau-entete"},
      el("div", {class: "panneau-titres"}, el("div", {class: "sid"}, surtitre), el("h2", {}, titre),
        detail ? el("div", {class: "fichier"}, detail) : null),
      el("button", {type: "button", class: "fermer", title: "Fermer (Échap)", "aria-label": "Fermer", onclick: toutDeselectionner}, "×"));
  }

  function tableau(lignes) {
    return lignes.length ? el("table", {class: "tableau"}, lignes.map(([cle, valeur]) => el("tr", {}, el("td", {}, cle), el("td", {}, valeur)))) : null;
  }

  function apercu(lignes) {
    return el("div", {class: "apercu"}, lignes.map((ligne) => el("div", {class: ligne.t, style: {paddingLeft: ligne.n * 16 + "px"}},
      ligne.t === "replique" ? [el("span", {class: "qui"}, ligne.qui), ligne.texte] : ligne.texte)));
  }

  function sortiePanneau(sortie) {
    const jamais = sortie.propose === false;
    return el("li", {class: jamais ? "jamais" : null},
      el("span", {class: "icone " + sortie.type}, sortie.si ? "◇" : (ICONES[sortie.type] || "•")),
      el("strong", {}, sortie.libelle),
      sortie.destination ? [" → ", lienScene(sortie.destination)] : null,
      sortie.si ? el("div", {class: "detail"}, "si ", el("code", {}, sortie.si)) : null,
      sortie.effets ? el("div", {class: "detail"}, "effets : ", el("code", {}, sortie.effets)) : null,
      jamais ? el("div", {class: "detail rouge"}, "Jamais proposé : sa condition est fausse sur toutes les routes.") : null,
      sortie.contenu && sortie.contenu.length ? apercu(sortie.contenu) : null);
  }

  function afficherScene(s) {
    const origines = [...new Set(liens.filter(({arete}) => arete.vers === s.id).map(({arete}) => arete.de))];
    const badges = [s.debut && badge("début", "vert"), !s.atteinte && badge("jamais atteinte", "rouge"),
      s.fin && badge("fin de partie", "gris"), s.retour && badge("scène appelée", "bleu"),
      s.galerie && badge("galerie : " + s.galerie, "bleu")].filter(Boolean);
    ouvrirPanneau([
      entetePanneau(s.id, s.titre || "(sans titre)", s.fichier),
      badges.length ? el("div", {class: "badges-panneau"}, badges) : null,
      section("Résumé", s.resume && el("p", {}, s.resume)),
      section("Lieu", (s.lieu || s.moment) && el("p", {}, [s.lieu, s.moment].filter(Boolean).join(" · "))),
      section("Objectif narratif", s.objectifs.length > 0 && el("ul", {}, s.objectifs.map((o) => el("li", {}, o)))),
      section("Personnages", s.personnages.length > 0 && el("p", {}, s.personnages.join(", "))),
      section("Conditions d'entrée", s.conditions.length > 0 && el("ul", {}, s.conditions.map((c) => el("li", {}, el("code", {}, c))))),
      section("Arrive depuis", origines.length ? el("p", {class: "liens-scenes"}, origines.map(lienScene))
        : el("p", {class: "doux"}, s.debut ? "Début du jeu." : "Aucune scène n'y mène.")),
      section("État possible à l'entrée", s.atteinte ? tableau(s.entree.map((v) => [v.variable, v.valeurs.join(", ")]))
        : el("p", {class: "doux"}, "Scène jamais atteinte depuis le début.")),
      section("Contenu", s.apercu.length ? apercu(s.apercu) : el("p", {class: "doux"}, "Pas encore de contenu : fiche squelette.")),
      section(s.question ? "Menu" : "Fin de scène", el("div", {}, s.question ? apercu([s.question]) : null,
        el("ul", {class: "sorties-panneau"}, s.sorties.map(sortiePanneau)))),
      section("Médias", s.medias.length > 0 && el("ul", {class: "medias"}, s.medias.map((m) => el("li", {},
        badge(m.etat, COULEUR_ETAT[m.etat] || "gris"), " ", el("code", {}, m.nom),
        el("span", {class: "doux"}, ` ${m.type}, ${m.usages}${m.ogv ? ", OGV " + m.ogv : ""}`))))),
      section("Traductions", s.traductions.length > 0 && el("ul", {}, s.traductions.map((t) => el("li", {},
        `${t.code.toUpperCase()} : ${t.faites}/${t.total}`,
        t.faites < t.total ? el("span", {class: "doux"}, " — à compléter (tools/fiches.py traduire)") : " ✓")))),
      section("Avertissements", s.avertissements.length > 0 && el("ul", {class: "problemes"}, s.avertissements.map((a) => el("li", {}, a)))),
      section("Notes", s.notes && el("p", {}, s.notes)),
      section("Exemple de route", s.route && el("p", {class: "route-texte"}, s.route)),
    ]);
  }

  function afficherRoute(route) {
    ouvrirPanneau([
      entetePanneau("Route de test", route.nom, "fin : " + route.fin),
      el("p", {class: "doux", style: {marginTop: "10px"}}, "Rejouée par les tests Godot et Ren'Py, dans chaque langue."),
      section("Étapes", route.etapes.length
        ? el("ol", {class: "etapes"}, route.etapes.map((e) => el("li", {}, lienScene(e.de),
          e.choix !== null ? ` « ${e.choix} » → ` : el("span", {class: "doux"}, " suite → "), lienScene(e.vers))))
        : el("p", {}, "Fin directe, sans choix.")),
      section("État final", tableau(Object.entries(route.etat))),
    ]);
  }

  $("bouton-avertissements").addEventListener("click", () => {
    choisi = null;
    routeActive = null;
    menuRoutes.value = "";
    miseAJour();
    ouvrirPanneau([
      entetePanneau("tools/fiches.py verifier", "Avertissements", null),
      D.problemes.length
        ? el("ul", {class: "problemes"}, D.problemes.map((p) => el("li", {},
          p.scene ? lienScene(p.scene) : el("span", {class: "fichier"}, p.ou), el("div", {}, p.message))))
        : el("p", {class: "doux", style: {marginTop: "14px"}}, "Aucun avertissement."),
    ]);
  });

  // --- Légende --------------------------------------------------------------------------------

  function echantillon(type) {
    const dessin = svgEl("svg", {width: 36, height: 10, "aria-hidden": "true"});
    dessin.append(svgEl("path", {d: "M1,5 L35,5", class: "lien " + type}));
    return dessin;
  }
  $("legende").append(
    el("ul", {},
      el("li", {}, echantillon("choix"), "choix"),
      el("li", {}, echantillon("jamais"), "choix jamais proposé"),
      el("li", {}, echantillon("suite"), "suite"),
      el("li", {}, echantillon("appel"), "appel, puis retour"),
      el("li", {}, echantillon("carte"), "lieu choisi sur une carte"),
      el("li", {}, el("span", {class: "icone-legende"}, "◇"), "choix sous condition"),
      el("li", {}, el("span", {class: "cadre-legende"}), "scène jamais atteinte")),
    el("p", {}, "Glisser : déplacer · Ctrl + molette ou pincer : zoom · double-clic : centrer · F : tout afficher · / : chercher · Échap : fermer"));
  $("bouton-legende").addEventListener("click", (e) => {
    const legende = $("legende");
    legende.hidden = !legende.hidden;
    e.currentTarget.classList.toggle("actif", !legende.hidden);
  });

  // --- Déplacement et zoom ----------------------------------------------------------------

  let tx = 0, ty = 0, k = 1;

  function appliquer() {
    plan.style.transform = `translate(${tx}px, ${ty}px) scale(${k})`;
    vue.style.backgroundPosition = `${tx}px ${ty}px`;
    vue.style.backgroundSize = `${22 * k}px ${22 * k}px`;
  }

  const largeurLibre = () => vue.clientWidth - (panneau.hidden ? 0 : panneau.offsetWidth);

  function zoomer(facteur, cx, cy) {
    const nk = Math.min(2.5, Math.max(0.08, k * facteur));
    if (cx === undefined) { cx = largeurLibre() / 2; cy = vue.clientHeight / 2; }
    tx = cx - (cx - tx) * nk / k;
    ty = cy - (cy - ty) * nk / k;
    k = nk;
    appliquer();
  }

  function cadrer(ids) {
    const liste = ids ? ids.map((id) => scenes.get(id)).filter(Boolean) : D.scenes;
    if (!liste.length) return;
    const x0 = Math.min(...liste.map((s) => s.x)) - 40, y0 = Math.min(...liste.map((s) => s.y)) - 60;
    const x1 = Math.max(...liste.map((s) => s.x + G.largeur)) + 40, y1 = Math.max(...liste.map((s) => s.y + s.h)) + 40;
    const largeur = largeurLibre(), hauteur = vue.clientHeight;
    k = Math.max(0.08, Math.min(1.2, largeur / (x1 - x0), hauteur / (y1 - y0)));
    tx = (largeur - (x1 - x0) * k) / 2 - x0 * k;
    ty = (hauteur - (y1 - y0) * k) / 2 - y0 * k;
    appliquer();
  }

  function centrer(id, nk) {
    const s = scenes.get(id);
    if (!s) return;
    if (nk) k = nk;
    tx = largeurLibre() / 2 - (s.x + G.largeur / 2) * k;
    ty = vue.clientHeight / 2 - (s.y + s.h / 2) * k;
    appliquer();
  }

  vue.addEventListener("wheel", (e) => {
    e.preventDefault();
    const echelle = e.deltaMode === 1 ? 16 : 1;
    if (e.ctrlKey || e.metaKey) {
      const r = vue.getBoundingClientRect();
      const delta = Math.max(-60, Math.min(60, e.deltaY * echelle));
      zoomer(Math.exp(-delta * 0.008), e.clientX - r.left, e.clientY - r.top);
    } else {
      tx -= e.deltaX * echelle;
      ty -= e.deltaY * echelle;
      appliquer();
    }
  }, {passive: false});

  let glisse = null;
  vue.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 || e.target.closest(".noeud")) return;
    glisse = {x: e.clientX, y: e.clientY, tx, ty, bouge: false};
    vue.setPointerCapture(e.pointerId);
  });
  vue.addEventListener("pointermove", (e) => {
    if (!glisse) return;
    const dx = e.clientX - glisse.x, dy = e.clientY - glisse.y;
    if (!glisse.bouge && Math.hypot(dx, dy) < 4) return;
    glisse.bouge = true;
    vue.classList.add("glisse");
    tx = glisse.tx + dx;
    ty = glisse.ty + dy;
    appliquer();
  });
  vue.addEventListener("pointerup", () => {
    if (glisse && !glisse.bouge) toutDeselectionner();
    glisse = null;
    vue.classList.remove("glisse");
  });

  $("zoom-plus").addEventListener("click", () => zoomer(1.25));
  $("zoom-moins").addEventListener("click", () => zoomer(0.8));
  $("tout-afficher").addEventListener("click", () => cadrer());

  document.addEventListener("keydown", (e) => {
    if (e.target.matches("input, select, textarea")) {
      if (e.key === "Escape") {
        if (e.target === recherche && recherche.value) {
          recherche.value = "";
          recherche.dispatchEvent(new Event("input"));
        }
        e.target.blur();
      }
      return;
    }
    if (e.key === "Escape") toutDeselectionner();
    else if (e.key === "f" || e.key === "F") cadrer();
    else if (e.key === "/") { e.preventDefault(); recherche.focus(); }
    else if (e.key === "+" || e.key === "=") zoomer(1.25);
    else if (e.key === "-") zoomer(0.8);
  });

  // --- Démarrage : tout afficher ; une ancre (#CH01_SC02, #route_01, #avertissements) ouvre
  // directement une scène, une route ou les avertissements.

  if (!D.scenes.length) calque.append(el("div", {class: "vide"}, "Aucune scène."));
  appliquer();
  cadrer();
  if (k < 0.5) {
    // Grand graphe : tout afficher le rendrait illisible, on part de la scène de début.
    const debut = D.scenes.find((s) => s.debut) || D.scenes[0];
    k = 0.8;
    tx = 40 - (debut.x - 20) * k;
    ty = vue.clientHeight / 2 - (debut.y + debut.h / 2) * k;
    appliquer();
  }
  const ancre = decodeURIComponent(location.hash.slice(1));
  if (scenes.has(ancre)) selectionner(ancre, true);
  else if (D.routes.some((r) => r.nom === ancre)) {
    menuRoutes.value = ancre;
    menuRoutes.dispatchEvent(new Event("change"));
  } else if (ancre === "avertissements") $("bouton-avertissements").click();
})();
</script>
</body>
</html>
